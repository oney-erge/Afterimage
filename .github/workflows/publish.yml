name: publish

# Builds the sdist and wheel and publishes them to PyPI whenever a GitHub
# release is published. Uses PyPI's trusted publishing (OpenID Connect): no
# API token is stored in this repository. Before the first release, the repo
# owner must add a trusted publisher on pypi.org for project
# "afterimage-llm" pointing at this repo, this workflow file
# (publish.yml), and the "pypi" environment below -- see
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # Fails the job if the release tag and pyproject.toml's version
      # disagree, so a mistagged release can't silently publish the wrong
      # version to PyPI.
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/afterimage-llm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
