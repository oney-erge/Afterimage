[project]
# The distribution name is "afterimage-llm", not "afterimage": PyPI's
# "afterimage" is an unrelated synthetic-data package
# (https://pypi.org/project/afterimage/). `pip install afterimage-llm`
# still installs the `afterimage` import package and the `afterimage` CLI
# command below -- only the name typed at `pip install` changes.
name = "afterimage-llm"
version = "0.3.0"
description = "Lossless weight-compressed streaming inference for models larger than your GPU"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    # Qwen3-VL entered Transformers in the 4.57 line. Keep the lower bound
    # aligned with the vision adapter and AutoModelForImageTextToText path.
    "transformers>=4.57.1",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    "psutil>=6.0",
    # Compiles the compression codec's chunk packer (huffman_chunked.py,
    # 19.2x measured over the pure-Python loop, byte-identical output) and
    # is what decode_chunks_numba (cpu_decode.py) runs on -- the only decode
    # path on a machine with no CUDA. A pure-Python fallback exists for both
    # (guarded by _HAS_NUMBA), but without numba there is no decode path at
    # all on non-CUDA hardware, so this is core, not optional.
    "numba>=0.58",
]

[project.urls]
Repository = "https://github.com/oney-erge/Afterimage"
Issues = "https://github.com/oney-erge/Afterimage/issues"

[project.optional-dependencies]
gpu = ["torch>=2.2", "triton>=2.2"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0", "websockets>=12.0", "pillow>=10.0"]
# dfloat11 ships CUDA-version-specific extras (cuda12/cuda11); cuda12 is the
# default here because it matches this project's reference RTX 3080 driver
# stack (see docs/TROUBLESHOOTING.md). Install "dfloat11[cuda11]" by hand
# instead if the target machine is on CUDA 11.
bench = ["airllm", "accelerate>=1.0", "dfloat11[cuda12]"]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0", "httpx>=0.27", "ruff>=0.6", "playwright>=1.49"]

[project.scripts]
afterimage = "afterimage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not archive'"
markers = [
    "archive: Phase-0 subspace-activation-cache branch, killed per its own pre-registered gate; excluded from the default run",
]

[tool.setuptools.packages.find]
include = ["afterimage*"]

[tool.setuptools.package-data]
"afterimage.server" = ["static/*", "static/css/*", "static/js/*"]
afterimage = ["py.typed"]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
# Starting narrow and unopinionated: unused imports/names and obvious bugs,
# not a full style rewrite of an existing 15k-line codebase in one pass.
select = ["F", "E9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
