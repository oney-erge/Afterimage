name: ci

on:
  push:
  pull_request:

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher syntax
        shell: pwsh
        run: |
          bash -n run.sh run.command
          shellcheck --severity=error run.sh run.command
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path run.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
      - name: Start the CPU container
        run: docker compose up --detach --build
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://127.0.0.1:8420/health
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Narrow ruleset (pyflakes + syntax errors) -- see pyproject.toml's
      # [tool.ruff.lint] comment for why this isn't a full style pass yet.
      - run: python -m ruff check afterimage
      # Keeps the docs a new user reads first from drifting back into
      # em-dash-heavy, AI-sounding prose. See scripts/check_prose.py.
      - run: python scripts/check_prose.py

  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # [server] is required for the fastapi/TestClient-based experiment-API
      # and job-control tests -- without it they silently skip via
      # pytest.importorskip rather than actually running in CI.
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m compileall -q afterimage
      - run: python -m pytest -q

  archive-tests:
    # Phase-0 subspace-activation-cache branch: killed per its own
    # pre-registered gate, kept and still correct, excluded from the default
    # run by pyproject's
    # `-m "not archive"`, verified here on every push so "kept, not deleted"
    # doesn't quietly rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m archive
