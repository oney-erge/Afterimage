<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="-apple-system,Segoe UI,sans-serif">
<title>Afterimage vs. baselines: peak VRAM and seconds per token, Qwen3-14B on an RTX 3080 Laptop GPU</title>
<style>
  :root { --ink:#1b1d2a; --muted:#5b6074; --rule:#d7d9e3; --bg:#ffffff;
          --spec:#5b3fe6; --exact:#0b8fb8; --base:#8a8f9e; --approx:#c9871f; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6e8f0; --muted:#9aa0b4; --rule:#333747; --bg:#161923;
            --spec:#a593ff; --exact:#43c6ee; --base:#9aa0b4; --approx:#e6b84d; }
  }
  rect.bg { fill: var(--bg); }
  .grid { stroke: var(--rule); stroke-width: 1; }
  .axis { stroke: var(--muted); stroke-width: 1.2; }
  .tick { fill: var(--muted); font-size: 12px; }
  .label { fill: var(--ink); font-size: 12px; }
  .legend { fill: var(--muted); font-size: 11.5px; }
  .axis-title { fill: var(--muted); font-size: 12.5px; }
</style>
<rect class="bg" x="0" y="0" width="720" height="510"/>
<line x1="60.0" y1="26" x2="60.0" y2="390" class="grid"/>
<text x="60.0" y="408" class="tick">0</text>
<line x1="200.0" y1="26" x2="200.0" y2="390" class="grid"/>
<text x="200.0" y="408" class="tick">1</text>
<line x1="340.0" y1="26" x2="340.0" y2="390" class="grid"/>
<text x="340.0" y="408" class="tick">2</text>
<line x1="480.0" y1="26" x2="480.0" y2="390" class="grid"/>
<text x="480.0" y="408" class="tick">3</text>
<line x1="620.0" y1="26" x2="620.0" y2="390" class="grid"/>
<text x="620.0" y="408" class="tick">4</text>
<line x1="60" y1="390.0" x2="690" y2="390.0" class="grid"/>
<text x="52" y="394.0" class="tick" text-anchor="end">0</text>
<line x1="60" y1="338.0" x2="690" y2="338.0" class="grid"/>
<text x="52" y="342.0" class="tick" text-anchor="end">5</text>
<line x1="60" y1="286.0" x2="690" y2="286.0" class="grid"/>
<text x="52" y="290.0" class="tick" text-anchor="end">10</text>
<line x1="60" y1="234.0" x2="690" y2="234.0" class="grid"/>
<text x="52" y="238.0" class="tick" text-anchor="end">15</text>
<line x1="60" y1="182.0" x2="690" y2="182.0" class="grid"/>
<text x="52" y="186.0" class="tick" text-anchor="end">20</text>
<line x1="60" y1="130.0" x2="690" y2="130.0" class="grid"/>
<text x="52" y="134.0" class="tick" text-anchor="end">25</text>
<line x1="60" y1="78.0" x2="690" y2="78.0" class="grid"/>
<text x="52" y="82.0" class="tick" text-anchor="end">30</text>
<line x1="60" y1="26.0" x2="690" y2="26.0" class="grid"/>
<text x="52" y="30.0" class="tick" text-anchor="end">35</text>
<line class="axis" x1="60" y1="26" x2="60" y2="390"/>
<line class="axis" x1="60" y1="390" x2="690" y2="390"/>
<text class="axis-title" x="375" y="432" text-anchor="middle">Peak VRAM (GB)</text>
<text class="axis-title" x="14" y="208" text-anchor="middle" transform="rotate(-90 14 208)">Seconds / token</text>
<polygon points="593.8,286.1 602.6,294.8 593.8,303.6 585.1,294.8" fill="var(--spec)"/>
<text x="593.8" y="314.8" class="label" text-anchor="middle">fixed speculation</text>
<circle cx="592.0" cy="241.1" r="7" fill="var(--base)"/>
<text x="592.0" y="261.1" class="label" text-anchor="middle">Accelerate</text>
<rect x="605.2" y="203.9" width="11.2" height="11.2" rx="2" fill="var(--exact)"/>
<text x="610.8" y="195.5" class="label" text-anchor="middle">exact + 4 GB residency</text>
<circle cx="281.6" cy="111.0" r="7" fill="var(--base)"/>
<text x="281.6" y="131.0" class="label" text-anchor="middle">AirLLM 3.2.0</text>
<circle cx="186.1" cy="82.1" r="7" fill="none" stroke="var(--approx)" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="186.1" y="68.1" class="label" text-anchor="middle">chunked output head</text>
<rect x="295.6" y="46.3" width="11.2" height="11.2" rx="2" fill="var(--exact)"/>
<text x="341.2" y="57.9" class="label" text-anchor="start">exact minimum-memory</text>
<polygon points="67.0,449.2 75.8,458.0 67.0,466.8 58.2,458.0" fill="var(--spec)"/>
<text x="80" y="462.0" class="legend">Speculative (greedy-exact)</text>
<rect x="391.4" y="452.4" width="11.2" height="11.2" rx="2" fill="var(--exact)"/>
<text x="410" y="462.0" class="legend">Exact (reference-equivalent)</text>
<circle cx="67.0" cy="482.0" r="7" fill="var(--base)"/>
<text x="80" y="486.0" class="legend">External baseline (same tokens)</text>
<circle cx="397.0" cy="482.0" r="7" fill="none" stroke="var(--approx)" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="410" y="486.0" class="legend">Approximate (not lossless)</text>
</svg>
