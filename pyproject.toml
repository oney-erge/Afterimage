[project]
name = "afterimage"
version = "0.1.0"
description = "Workload-adaptive subspace caching for offloaded LLM inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
models = ["transformers>=4.40", "safetensors>=0.4", "accelerate>=0.30"]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["afterimage*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
