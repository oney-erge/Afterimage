# docker compose up
#
# CPU-first default. Add compose.nvidia.yaml on a supported NVIDIA host.
# Persists compressed stores and the HuggingFace download cache in the
# `afterimage-data` volume so the expensive one-time compression pass (and
# model downloads) survive container rebuilds. Requires the NVIDIA
# Container Toolkit for GPU passthrough (nvidia-ctk / nvidia-docker2).
services:
  afterimage:
    build:
      context: .
      args:
        VARIANT: cpu
    image: afterimage:cpu
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AFTERIMAGE_PORT:-8420}:8420"
    volumes:
      - afterimage-data:/data

volumes:
  afterimage-data:
